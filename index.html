<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JNFAM 재고 현황 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --txt:#1e2532; --sub:#6b7688;
  --blue:#2563eb; --blue-l:#eff4ff; --green:#059669; --green-l:#ecfdf5;
  --amber:#d97706; --amber-l:#fffbeb; --red:#dc2626; --red-l:#fef2f2;
  --purple:#7c3aed; --purple-l:#f5f3ff; --slate-l:#f1f5f9;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Malgun Gothic',sans-serif}
body{background:var(--bg);color:var(--txt);font-size:14px}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#101827;color:#cbd5e1;padding:20px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .logo{padding:0 20px 18px;border-bottom:1px solid #2a3548;margin-bottom:12px}
.sidebar .logo b{color:#fff;font-size:17px;display:block}
.sidebar .logo span{font-size:11px;color:#7d8aa0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;font-size:14px;border-left:3px solid transparent}
.nav-item:hover{background:#1a2438;color:#fff}
.nav-item.active{background:#1e2a44;color:#fff;border-left-color:var(--blue)}
.nav-item .badge{margin-left:auto;background:var(--amber);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
.nav-link{display:block;padding:9px 20px;font-size:12.5px;color:#93c5fd;text-decoration:none}
.nav-link:hover{background:#1a2438}
.conn{margin:14px 20px 0;padding:8px 10px;border-radius:8px;font-size:12px;background:#1a2438;line-height:1.5}
.conn .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.conn a{color:#93c5fd;text-decoration:none;font-size:11px}
.login-gate{position:fixed;inset:0;z-index:9999;background:#101827;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border-radius:14px;padding:36px 34px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.login-card .lg-logo{font-size:22px;font-weight:700}
.login-card .lg-sub{font-size:12px;color:var(--sub);margin-top:4px}
.login-card .lg-desc{font-size:13px;color:var(--sub);margin:22px 0 20px;line-height:1.6}
.login-card .lg-btn{width:100%;justify-content:center;padding:11px 16px;font-size:14px}
.login-card .lg-msg{margin-top:16px;font-size:13px;color:var(--red);line-height:1.6;white-space:pre-line;display:none}
.login-card .lg-msg.on{display:block}
.main{flex:1;padding:24px 28px;max-width:1600px;min-width:0}
h2.page-title{font-size:20px;margin-bottom:4px}
.page-sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .k-label{font-size:12px;color:var(--sub);margin-bottom:6px}
.kpi .k-value{font-size:23px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:12px;color:var(--sub);margin-top:4px}
.kpi.b-blue{border-top:3px solid var(--blue)} .kpi.b-amber{border-top:3px solid var(--amber)}
.kpi.b-green{border-top:3px solid var(--green)} .kpi.b-purple{border-top:3px solid var(--purple)}
.kpi.b-red{border-top:3px solid var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px;min-width:0}
.panel h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .spacer{flex:1}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.grid2e{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1100px){.grid2,.grid2e{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f8fafc;color:var(--sub);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid #f0f2f6;white-space:nowrap}
tr.dim td{color:#9aa4b5}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:160px;max-width:320px;font-size:12px;color:var(--sub)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.tag.ok{background:var(--green-l);color:var(--green)}
.tag.warn{background:var(--red-l);color:var(--red)}
.tag.amber{background:var(--amber-l);color:var(--amber)}
.tag.gray{background:var(--slate-l);color:#64748b}
.tag.purple{background:var(--purple-l);color:var(--purple)}
.tag.blue{background:var(--blue-l);color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff} .btn.primary:hover{background:#1d4ed8}
.btn.green{background:var(--green);color:#fff}
.btn.amber{background:var(--amber);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.danger{background:var(--red-l);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .spacer{flex:1}
select,input[type=text],input[type=number],input[type=date],textarea{
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;color:var(--txt);width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid #bfd3ff;border-color:var(--blue)}
.w-auto{width:auto!important}
.panel h3 .sel-sm{padding:5px 8px;font-size:12px;font-weight:500}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ptab{padding:8px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600}
.ptab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.ptab small{font-weight:400;opacity:.8;margin-left:4px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;width:760px;max-width:100%;padding:22px}
.modal.wide{width:980px}
.modal h3{font-size:16px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form-grid .full{grid-column:1/-1} .form-grid .span2{grid-column:span 2}
@media(max-width:700px){.form-grid{grid-template-columns:1fr}.form-grid .span2{grid-column:auto}}
.fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
.fld .chk{display:flex;align-items:center;gap:8px;font-size:13px;padding-top:6px}
.fld .chk input{width:auto}
.calc-box{background:#f8fafc;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.calc-box b{font-variant-numeric:tabular-nums}
.calc-box .bad{color:var(--red)} .calc-box .good{color:var(--green)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;align-items:center}
.modal-actions .left{margin-right:auto}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:20px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .15s}
.pcard:hover{box-shadow:0 4px 14px rgba(15,23,42,.08)}
.pcard.low{border-color:#fca5a5;background:#fffafa}
.pcard .pc-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pcard .pc-name{font-weight:800;font-size:15px}
.pcard .pc-code{font-size:11px;color:var(--sub)}
.pcard .pc-label{font-size:12px;color:var(--blue);font-weight:700;margin-top:2px}
.pcard .pc-total{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;color:var(--txt)}
.pcard .pc-sep{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.pcard .pc-grand{color:var(--sub)} .pcard .pc-grand .v{color:var(--sub);font-weight:600}
.pcard .pc-total small{font-size:12px;color:var(--sub);font-weight:600;margin-left:3px}
.pcard .bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#eef1f6;margin:10px 0 8px}
.pcard .bar span{display:block;height:100%}
.pcard .row{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0}
.pcard .row .v{font-weight:600;font-variant-numeric:tabular-nums}
.pcard .row .dotc{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.chart-wrap{height:300px;position:relative}
.empty{color:var(--sub);text-align:center;padding:26px;font-size:13px}
.banner{background:var(--amber-l);border:1px solid #fcd34d;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner.red{background:var(--red-l);border-color:#fca5a5}
.banner.blue{background:var(--blue-l);border-color:#bfd3ff}
.tbl-scroll{overflow-x:auto}
.tbl-scroll.tall{max-height:560px;overflow-y:auto}
.toast{position:fixed;bottom:24px;right:24px;background:#101827;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:100;display:none;max-width:420px}
.help{font-size:12px;color:var(--sub);line-height:1.7}
/* 변경 이력 */
.hist-panel{padding:14px 18px}
.hist-list{list-style:none;margin:0;padding:0}
.hist-list li{display:grid;grid-template-columns:118px 150px 120px 1fr;gap:10px;align-items:center;padding:7px 2px;border-top:1px solid var(--line);font-size:13px}
.hist-list li:first-child{border-top:none}
.hist-time{color:var(--sub);font-size:12px;white-space:nowrap}
.hist-user{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-sum{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-sum .chg{color:var(--sub);font-size:12px;margin-left:6px}
@media(max-width:900px){.hist-list li{grid-template-columns:1fr 1fr}.hist-sum{grid-column:1/-1;white-space:normal}}
.tag.h-add{background:var(--blue-l);color:var(--blue)}
.tag.h-upd{background:var(--slate-l);color:#475569}
.tag.h-del{background:var(--red-l);color:var(--red)}
.tag.h-cv{background:var(--green-l);color:var(--green)}
.tag.h-out{background:var(--amber-l);color:var(--amber)}
.tag.h-cfg{background:var(--purple-l);color:var(--purple)}
.hist-detail td{background:#f8fafc;font-size:12px;color:var(--sub);padding:8px 14px}
.hist-detail .d-row{display:inline-block;margin:2px 14px 2px 0}
.hist-detail .d-row b{color:var(--txt)}
.hist-detail del{color:var(--red)} .hist-detail ins{color:var(--green);text-decoration:none;font-weight:600}
tr.hist-row{cursor:pointer} tr.hist-row:hover td{background:#f8fafc}
.help code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:11.5px}
.mono{font-family:Consolas,monospace;font-size:12px}
.d-late{color:var(--red);font-weight:700} .d-soon{color:var(--amber);font-weight:700} .d-ok{color:var(--green);font-weight:600}
.split-tbl td{padding:4px 6px} .split-tbl input{padding:6px 8px}
.legend-inline{display:flex;gap:14px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend-inline i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mobile-top{display:none}
@media(max-width:860px){
  .sidebar{position:fixed;left:-240px;z-index:60;transition:left .2s}
  .sidebar.open{left:0}
  .mobile-top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#101827;color:#fff;position:sticky;top:0;z-index:40}
  .main{padding:16px}
  .layout{flex-direction:column}
}
</style>
</head>

  </div>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
/* =====================================================================
   JNFAM 재고 현황 시스템 (Inventory Status)
   - Firestore (jnfam-ledger 프로젝트) : inv_products / inv_lots / inv_usage / inv_isos / inv_snapshots
   - 수불부 연동 : inbound 컬렉션(invType 미착품·선적예정) 읽기 + 입고 등록 시 미착품→상품 전환
   - 출하 연동  : 출하(IBC)·ISO 출하 → 수불부 outbound(Goods Issue) 자동 등록/차감/삭제
   ===================================================================== */
const FB_CFG = {
  apiKey: "AIzaSyDB1-k-Xp98Sw3mx2AM3AxROo-Y4_4FZoY",
  authDomain: "jnfam-ledger.firebaseapp.com",
  projectId: "jnfam-ledger",
  storageBucket: "jnfam-ledger.firebasestorage.app",
  messagingSenderId: "656610691213",
  appId: "1:656610691213:web:1d03f91bd8dd36b2283ac4"
};
const FB_URL='https://www.gstatic.com/firebasejs/10.12.2/';
const COL={products:'inv_products',lots:'inv_lots',usage:'inv_usage',isos:'inv_isos',snaps:'inv_snapshots',ledger:'inbound',hist:'inv_history',ledgerHist:'history',out:'outbound',cfg:'config'};
const DEMO = new URLSearchParams(location.search).has('demo') || location.protocol==='file:';

const state={products:[],lots:[],usage:[],isos:[],snaps:[],ledger:[],outbound:[],outErr:null,ledgerMaster:null,
  view:'dashboard', prod:null, stockFilter:'stock', usageF:{prod:'',type:'',from:'',to:'',q:''}, isoF:'대기',
  loaded:false, ledgerErr:null, invErr:null, chartF:{prod:'',part:'',trend:''},
  history:[], historyErr:'', histF:{user:'',action:'',q:'',from:'',to:''}, histOpen:null};
let fb=null, AUM=null, auth=null, currentUser=null, unsubs=[], charts={};

/* ---------------- 유틸 ---------------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(+n||0)).toLocaleString('en-US');
const fmt1=n=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:1});
const ton=n=>((+n||0)/1000).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const pad=n=>String(n).padStart(2,'0');
const dLocal=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dLocal(new Date());
const dstr=v=>{ if(!v) return ''; if(typeof v==='string') return v.slice(0,10); if(v.toDate) return dLocal(v.toDate()); return ''; };
const addDays=(s,n)=>{ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return dLocal(d); };
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const who=()=>currentUser?currentUser.email:(DEMO?'demo':'');
function toast(m,ms=2800){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',ms); }
function openModal(html,wide){ $('modalBox').className='modal'+(wide?' wide':''); $('modalBox').innerHTML=html; $('modalBg').classList.add('open'); }
function closeModal(){ $('modalBg').classList.remove('open'); }
$('modalBg').addEventListener('mousedown',e=>{ if(e.target.id==='modalBg') closeModal(); });
const dday=(d)=>{ if(!d) return ''; const n=diffDays(d,today()); if(n<0) return `<span class="d-late">D+${-n}</span>`; if(n===0) return `<span class="d-soon">D-Day</span>`; if(n<=7) return `<span class="d-soon">D-${n}</span>`; return `<span class="d-ok">D-${n}</span>`; };

/* ---------------- 데이터 계층 ---------------- */
async function dbSet(col,obj){
  if(!obj.id) obj.id=uid(col.slice(4,6)||'x');
  obj.updatedBy=who(); obj.updatedAt=new Date().toISOString();
  if(!obj.createdBy){ obj.createdBy=who(); obj.createdAt=obj.updatedAt; }
  if(fb) await fb.setDoc(fb.doc(fb.db,col,obj.id),obj);
  else { const k=colKey(col); const i=state[k].findIndex(x=>x.id===obj.id); if(i>=0) state[k][i]=obj; else state[k].push(obj); render(); }
}
async function dbPatch(col,id,patch){
  patch.updatedBy=who(); patch.updatedAt=new Date().toISOString();
  if(fb) await fb.setDoc(fb.doc(fb.db,col,id),patch,{merge:true});
  else { const k=colKey(col); const r=state[k].find(x=>x.id===id); if(r) Object.assign(r,patch); render(); }
}
async function dbDel(col,id){
  if(fb) await fb.deleteDoc(fb.doc(fb.db,col,id));
  else { const k=colKey(col); state[k]=state[k].filter(x=>x.id!==id); render(); }
}
async function dbBatch(ops){ // ops: [{t:'set'|'patch'|'del', col, id, data}]
  if(!fb){ for(const o of ops){ if(o.t==='set') await dbSet(o.col,o.data); else if(o.t==='patch') await dbPatch(o.col,o.id,o.data); else await dbDel(o.col,o.id);} return; }
  let b=fb.writeBatch(fb.db), n=0; const now=new Date().toISOString();
  for(const o of ops){
    const ref=fb.doc(fb.db,o.col,o.id||o.data.id);
    if(o.t==='set'){ const d={...o.data,updatedBy:who(),updatedAt:now}; if(!d.createdBy){d.createdBy=who();d.createdAt=now;} b.set(ref,d); }
    else if(o.t==='patch') b.set(ref,{...o.data,updatedBy:who(),updatedAt:now},{merge:true});
    else b.delete(ref);
    if(++n>=400){ await b.commit(); b=fb.writeBatch(fb.db); n=0; }
  }
  await b.commit();
}
const colKey=c=>({inv_products:'products',inv_lots:'lots',inv_usage:'usage',inv_isos:'isos',inv_snapshots:'snaps',inbound:'ledger',outbound:'outbound'}[c]);

/* ---------------- 변경 이력 (inv_history, 추가 전용) ---------------- */
const FIELD_LABEL={product:'품목',receivedDate:'입고일',sourceLot:'Lot #',container:'용기',unitKg:'단위중량',qtyIn:'입고수량',location:'보관위치',invoice:'Invoice',
  mfgDate:'MFG Date',shelfLife:'Shelf life',coa:'CoA',hold:'Hold',jnfamLots:'JNFAM Lot 메모',note:'비고',
  tankNo:'탱크',qtyKg:'수량',fillDate:'충전일',status:'상태',shipDate:'출하일',customer:'고객',jnfamLot:'JNFAM Lot',
  name:'품목명',code:'코드',ledgerItem:'수불부 품목',ledgerPurity:'수불부 농도',lotPrefix:'Lot 접두어',ibcKg:'IBC 1EA',isoKg:'ISO 1탱크',minStock:'최소 재고',order:'순서'};
const SKIP_F=new Set(['id','key','updatedBy','updatedAt','createdBy','createdAt','receivedDateEstimated','sourceUsageIds','ledgerInboundId','isoId']);
function hv(k,v){
  if(v==null||v==='') return '(빈값)';
  if(typeof v==='boolean') return v?'Y':'N';
  if(k==='product') return pname(v);
  if(k==='ledgerPurity') return (+v*100).toFixed(0)+'%';
  if(typeof v==='number') return fmt1(v);
  if(v&&v.toDate) return dstr(v);
  return String(v);
}
function diffObj(a,b){
  const out=[]; a=a||{};
  Object.keys(b).forEach(k=>{
    if(SKIP_F.has(k)) return;
    const x=a[k], y=b[k];
    if((x&&typeof x==='object'&&!x.toDate)||(y&&typeof y==='object'&&!y.toDate)) return;
    const nx=(x==null?'':x), ny=(y==null?'':y);
    if((typeof nx==='number'||typeof ny==='number') && nx!=='' && ny!==''){ if(Math.abs((+nx||0)-(+ny||0))<0.005) return; }
    else if(String(typeof nx==='object'?dstr(nx):nx)===String(typeof ny==='object'?dstr(ny):ny)) return;
    out.push({f:k,label:FIELD_LABEL[k]||k,from:hv(k,x),to:hv(k,y)});
  });
  return out;
}
function histEntry({action,kind,col,docId,summary,changes,product}){
  const now=new Date();
  return {id:uid('h'),tsMs:now.getTime(),ts:now.toISOString(),user:who()||'-',userName:currentUser?(currentUser.displayName||''):'',
    action,kind:kind||'upd',col:col||'',docId:docId||'',product:product||'',summary:summary||'',changes:(changes||[]).slice(0,40)};
}
async function logHistory(e, colName){
  try{
    const h=histEntry(e);
    if(fb) await fb.setDoc(fb.doc(fb.db,colName||COL.hist,h.id),h);
    else if(!colName||colName===COL.hist){ state.history.unshift(h); render(); }
  }catch(err){ console.warn('이력 기록 실패',err); }
}
const lotLabel=l=>`${pname(l.product)} · Lot ${l.sourceLot||'(no lot)'}`;
const userShort=h=>h.userName||(h.user||'').split('@')[0]||'-';
function relTime(ms){ const d=(Date.now()-ms)/1000;
  if(d<60) return '방금 전'; if(d<3600) return Math.floor(d/60)+'분 전'; if(d<86400) return Math.floor(d/3600)+'시간 전'; if(d<604800) return Math.floor(d/86400)+'일 전';
  return dLocal(new Date(ms)); }
const absTime=ms=>{ const d=new Date(ms); return dLocal(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const histTag=h=>`<span class="tag h-${h.kind||'upd'}">${esc(h.action)}</span>`;
const chgText=(h,n)=>{ const c=h.changes||[]; if(!c.length) return ''; return c.slice(0,n).map(x=>`${x.label} ${x.from}→${x.to}`).join(', ')+(c.length>n?` 외 ${c.length-n}건`:''); };

/* ---------------- Firebase + Google 로그인 ---------------- */
function setConn(kind,text,extra){
  const C={ok:'#22c55e',wait:'#f59e0b',off:'#94a3b8',err:'#ef4444'};
  $('connStatus').innerHTML='<span class="dot" style="background:'+(C[kind]||'#94a3b8')+'"></span>'+text+(extra||'');
}
function showLogin(msg){ $('loginGate').style.display='flex'; const m=$('loginMsg'); m.textContent=msg||''; m.classList.toggle('on',!!msg); $('loginAlt').style.display=msg?'inline-flex':'none'; }
function hideLogin(){ $('loginGate').style.display='none'; }
async function googleLogin(){
  if(!auth){ toast('Firebase 초기화 전입니다'); return; }
  try{ const p=new AUM.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'}); await AUM.signInWithPopup(auth,p); }
  catch(e){ if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request') return; showLogin('로그인 실패: '+(e.code||e.message)); }
}
async function logout(){ if(auth){ try{ await AUM.signOut(auth); }catch(e){} } }
function stopListeners(){ unsubs.forEach(u=>{try{u();}catch(e){}}); unsubs=[]; }

function startListeners(fsM,db){
  stopListeners();
  fb={db,doc:fsM.doc,setDoc:fsM.setDoc,deleteDoc:fsM.deleteDoc,collection:fsM.collection,writeBatch:fsM.writeBatch,getDocs:fsM.getDocs};
  const pending=new Set(['products','lots','usage','isos','snaps']);
  setConn('wait','데이터 불러오는 중…');
  const done=k=>{ pending.delete(k); if(!pending.size){ state.loaded=true; setConn('ok','Firebase 연결됨<br><span style="opacity:.75">'+esc(who())+'</span>','<div style="margin-top:6px"><a href="#" onclick="app.logout();return false">로그아웃</a></div>'); afterLoad(); } };
  const onErr=(k)=>err=>{
    if(err.code==='permission-denied'){
      if(k==='ledger'){ state.ledgerErr='수불부(inbound) 읽기 권한이 없습니다'; render(); return; }
      stopListeners(); fb=null;
      setConn('err','접근 권한 없음');
      state.invErr=true;
      showLogin('이 계정('+who()+')은 재고 데이터 접근 권한이 없습니다.\n관리자에게 계정 등록 또는 Firestore 규칙(inv_*) 추가를 요청하세요.');
    } else { setConn('err','Firestore 오류: '+err.code); toast('Firestore 오류: '+err.code); }
  };
  [['products',COL.products],['lots',COL.lots],['usage',COL.usage],['isos',COL.isos],['snaps',COL.snaps]].forEach(([k,c])=>{
    unsubs.push(fsM.onSnapshot(fsM.collection(db,c),snap=>{ state[k]=snap.docs.map(d=>({id:d.id,...d.data()})); done(k); render(); },onErr(k)));

const ibcProducts=()=>products().filter(p=>state.lots.some(l=>l.product===p.key));

/* ① 마지막 실사 이후 시스템 IBC 변화 분해 (입고 / 사용 / 삭제 / 설명 안 됨) */

  Object.values(g).filter(v=>near(v.kg)).forEach(v=>out.push(`${dstr(v.x.date)} ${v.x.type} ${fmt(v.kg)} kg · ${v.x.customer||''} ${v.x.jnfamLot||''} (등록 ${(v.x.createdAt||'').slice(0,10)})${v.x.outboundId?'':' · 수불부 미연결'}`));
  const lk=ledgerKey(k); if(lk) state.outbound.filter(o=>o.item===lk.item&&Math.abs(+o.purity-lk.purity)<1e-4&&near(+o.qty)&&(dstr(o.date)>=dstr(new Date(since).toISOString()))).forEach(o=>out.push(`수불부 출고 ${dstr(o.date)} ${o.buyer||''} ${fmt(o.qty)} kg${o.src==='inventory'?'':' · 재고현황 미연결'}`));

async function saveCount(){
  const pc=state.physCount||{}; const items={};
  ibcProducts().forEach(p=>{ const v=pc[p.key]; if(v!==''&&v!=null&&!isNaN(+v)){ const s=sysIbc(p.key); items[p.key]={phys:+v,sys:s.ea,sysKg:Math.round(s.kg)}; } });
  if(!Object.keys(items).length){ toast('실제 IBC 개수를 입력하세요'); return; }
  const d=today(), prev=state.snaps.find(x=>x.id===d); const merged={...((prev&&prev.count&&prev.count.items)||{}),...items};
  const count={tsMs:Date.now(),ts:new Date().toISOString(),user:who(),userName:currentUser?(currentUser.displayName||''):'',items:merged};
  try{ if(prev&&fb) await dbPatch(COL.snaps,d,{count}); else if(prev){ prev.count=count; render(); } else await dbSet(COL.snaps,{id:d,date:d,items:{},count}); }
  catch(e){ toast('실사 저장 실패: '+(e.code||e.message),5000); return; }
  const txt=Object.entries(items).map(([k,v])=>`${pname(k)} 실사 ${fmt1(v.phys)} / 시스템 ${fmt1(v.sys)}${Math.abs(v.phys-v.sys)<0.01?' 일치':` (차이 ${v.phys-v.sys>0?'+':''}${fmt1(v.phys-v.sys)})`}`).join(' · ');
  logHistory({action:'실사 기록',kind:'upd',col:COL.snaps,docId:d,summary:txt});
  toast('실사 저장 완료');
}

/* ---------- 정합성 점검 ----------
   ① 품목별 수불부 상품재고(기초+상품입고−출고) vs 재고현황 창고재고(IBC+ISO대기+Lot미등록)
   ② 의심 항목: 마이너스 Lot, 끊어진 연동, 미반영 출하, Batch↔ISO 불일치·중복 등 */
const CHECK_FROM='2026-10-01'; // 이 날짜 이후 기록만 연동 누락 점검 (이전 엑셀 이관분 제외)
let _batchLoadAt=0;
async function loadBatchDocs(force){

function checkAll(){
  const rows=[], issues=[]; const rm=remMap(); const beg=state.ledgerBeg||[];
  const same=(a,b)=>Math.abs((+a||0)-(+b||0))<1e-4;
  products().forEach(p=>{ const lk=ledgerKey(p.key); if(!lk) return;
    const isLk=r=>r.item===lk.item&&same(r.purity,lk.purity);
    const lb=beg.filter(isLk).reduce((s,b)=>s+(+b.qty||0),0);
    const lin=state.ledger.filter(r=>isLk(r)&&r.invType==='상품').reduce((s,r)=>s+(+r.qty||0),0);
    const lout=state.outbound.filter(r=>isLk(r)&&r.category!=='충전').reduce((s,r)=>s+(+r.qty||0),0);
    const ledgerGoods=lb+lin-lout;
    const lots=state.lots.filter(l=>l.product===p.key);
    const ibcRaw=lots.reduce((s,l)=>s+((+l.qtyIn||0)-(rm[l.id]||0)),0);
    const ibcEA=lots.reduce((s,l)=>{ const r=(+l.qtyIn||0)-(rm[l.id]||0); return s+(r>0.5?r/(+l.unitKg||p.ibcKg||1):0); },0);
    const iso=state.isos.filter(i=>i.product===p.key&&i.status==='대기').reduce((s,i)=>s+(+i.qtyKg||0),0);
    const arr=arrivedNoLot(p.key).reduce((s,r)=>s+(+r.qty||0),0);
    const inv=ibcRaw+iso+arr, diff=Math.round(inv-ledgerGoods);
    if(!state.outErr&&(ledgerGoods||inv)) rows.push({key:p.key,name:p.name,ledgerGoods,ibcRaw,ibcEA,iso,arr,inv,diff,bad:Math.abs(diff)>=1});
    lots.forEach(l=>{ const r=(+l.qtyIn||0)-(rm[l.id]||0); if(r<-0.5) issues.push({sev:'red',cat:'마이너스 Lot',prod:p.key,text:`${p.name} · Lot ${l.sourceLot} 잔량 ${fmt(r)} kg (입고 ${fmt(l.qtyIn)} kg보다 많이 사용) — 화면에는 0으로 표시됨`,act:`app.lotDetail('${l.id}')`,btn:'Lot 보기'}); });
  });
  const outIds=new Set(state.outbound.map(o=>o.id));
  // ISO
  state.isos.forEach(i=>{ const nm=`${pname(i.product)} ISO ${i.tankNo||''} ${i.jnfamLot||''} ${fmt(i.qtyKg)} kg`;
    if(i.status==='출하완료'&&i.outboundId&&!outIds.has(i.outboundId)&&!state.outErr) issues.push({sev:'red',cat:'수불부 출고 삭제됨',prod:i.product,text:`${nm} — 출하완료인데 연결된 수불부 출고가 삭제됨 (실제 출하 전이면 ISO를 대기로, 출하됐으면 수불부 반영)`,act:`app.isoModal('${i.id}')`,btn:'ISO 수정'});
    else if(i.status==='출하완료'&&!i.outboundId&&(dstr(i.shipDate)||'')>=CHECK_FROM&&!state.outErr) issues.push({sev:'amber',cat:'수불부 미반영',prod:i.product,text:`${nm} · 출하 ${dstr(i.shipDate)} — 수불부 출고 없음`,act:`app.linkModal('i','${i.id}')`,btn:'수불부 반영'});
    const src=(i.sourceUsageIds||[]); const srcKg=src.reduce((s,u)=>{ const x=state.usage.find(y=>y.id===u); return s+(x?(+x.qtyKg||0):0); },0);
    if(src.length&&Math.abs(srcKg-(+i.qtyKg||0))>0.5) issues.push({sev:'amber',cat:'ISO 수량 불일치',prod:i.product,text:`${nm} — 충전 기록 합계 ${fmt(srcKg)} kg과 다름`,act:`app.isoModal('${i.id}')`,btn:'ISO 보기'});
  });
  // 같은 Batch에서 나온 ISO 중복

  Object.values(byB).filter(a=>a.length>1).forEach(a=>issues.push({sev:'red',cat:'ISO 중복',prod:a[0].product,text:`${pname(a[0].product)} · 같은 Batch Sheet에서 ISO ${a.length}개 생성 (${a.map(i=>`${i.jnfamLot||''} ${i.status} ${fmt(i.qtyKg)}kg ${dstr(i.fillDate)}`).join(' / ')}) — 이중 차감 가능성`,act:`app.go('iso')`,btn:'ISO 탭'}));

    const want=+(u&&u.kg)||0; if(want&&Math.abs(want-(+i.qtyKg||0))>0.5) issues.push({sev:'red',cat:'Batch↔ISO',prod:i.product,text:`Batch ${bn} 사용량 ${fmt(want)} kg ≠ ISO ${i.jnfamLot||''} ${fmt(i.qtyKg)} kg — 재고 현황에서 충전 기록이 수정/삭제된 것으로 보임`,act:`app.isoModal('${i.id}')`,btn:'ISO 보기'});
    const missU=(u&&u.usageIds||[]).filter(id=>!state.usage.some(x=>x.id===id)); if(missU.length) issues.push({sev:'red',cat:'Batch↔ISO',prod:i.product,text:`Batch ${bn} — 충전 기록 ${missU.length}건이 재고 현황에서 삭제됨 (IBC가 실제보다 많게 잡힘)`,act:`app.isoModal('${i.id}')`,btn:'ISO 보기'});
  });

    const seen=new Set();
    state.usage.filter(u=>u.type==='출하'&&u.createdBy!=='excel-import'&&(dstr(u.date)||'')>=CHECK_FROM&&!outIds.has(u.outboundId)).forEach(u=>{ const k=[u.product,dstr(u.date),u.createdAt,u.customer].join('|'); if(seen.has(k)) return; seen.add(k);
      const grp=state.usage.filter(x=>x.type==='출하'&&x.product===u.product&&dstr(x.date)===dstr(u.date)&&x.createdAt===u.createdAt&&(x.customer||'')===(u.customer||'')&&!outIds.has(x.outboundId));
      issues.push({sev:u.outboundId?'red':'amber',cat:u.outboundId?'수불부 출고 삭제됨':'수불부 미반영',prod:u.product,text:`${pname(u.product)} 출하 ${dstr(u.date)} · ${u.customer||'-'} · ${fmt(grp.reduce((s,x)=>s+(+x.qtyKg||0),0))} kg${u.outboundId?' — 연결된 수불부 출고가 삭제됨':''}`,act:`app.linkModal('u','${u.id}')`,btn:'수불부 반영'}); });
    state.outbound.filter(o=>o.src==='inventory').forEach(o=>{ const ui=o.invUsageIds||[]; const hasU=ui.some(id=>state.usage.some(x=>x.id===id)); const hasI=o.invIsoId&&state.isos.some(x=>x.id===o.invIsoId);
      if(!hasU&&!hasI) issues.push({sev:'red',cat:'재고 기록 삭제됨',prod:'',text:`수불부 출고 ${dstr(o.date)} ${o.item} ${(+o.purity*100).toFixed(0)}% → ${o.buyer||''} ${fmt(o.qty)} kg — 연결된 재고 현황 출하/ISO가 삭제됨 (수불부에만 남음)`}); });
  }
  // 입고
  state.ledger.filter(r=>r.invType==='미착품'&&ledgerProd(r)&&recvDone(r)).forEach(r=>issues.push({sev:'amber',cat:'수불부 전환 대기',prod:ledgerProd(r),text:`${pname(ledgerProd(r))} ${r.invoice||''} — 전량 입고됐지만 수불부가 아직 미착품`,act:`app.convertLedger('${r.id}')`,btn:'상품 전환'}));

  products().forEach(p=>{ const lc=lastCount(p.key); const ts=lc&&lc.tsMs?lc.tsMs:Date.now()-14*86400000; const base=lc?`마지막 실사(${lc.date}) 이후`:'최근 14일';
    const d=lc?ibcDrift(p.key):null;

    <div class="fld"><label>상태</label><div class="chk"><input type="checkbox" id="l_coa" ${l.coa?'checked':''}>CoA 수령</div><div class="chk"><input type="checkbox" id="l_hold" ${l.hold?'checked':''}>Hold (출고 보류)</div></div>

function lotCalc(){ const u=+$('l_unit').value, e=+$('l_ea').value; if(u&&e) $('l_qty').value=Math.round(u*e*100)/100; }
async function saveLot(id){
  const old=id?state.lots.find(x=>x.id===id):{};
  const rd=$('l_date').value; const qty=+$('l_qty').value;
  if(!qty||qty<=0){ toast('입고수량을 입력하세요'); return; }
  if(id && qty < lotUsedC(old)-0.01){ if(!confirm('입고수량이 이미 사용된 수량보다 작습니다. 계속할까요?')) return; }
  const o={...old,id:id||undefined,product:$('l_product').value,receivedDate:rd,receivedDateEstimated:id?(old.receivedDateEstimated&&rd===old.receivedDate):false,sourceLot:$('l_lot').value.trim(),container:$('l_cont').value,
    unitKg:+$('l_unit').value||0,qtyIn:qty,location:$('l_loc').value.trim()||'창고',invoice:$('l_inv').value.trim(),mfgDate:$('l_mfg').value,
    shelfLife:$('l_shelf').value||(rd?addDays(rd,364):''),coa:$('l_coa').checked,hold:$('l_hold').checked,jnfamLots:$('l_jl').value.trim(),note:$('l_note').value.trim()};
  if(!id){ delete o.id; }
  await dbSet(COL.lots,o); closeModal(); toast('저장되었습니다');
  if(id){ const ch=diffObj(old,o); if(ch.length) logHistory({action:'Lot 수정',kind:'upd',col:COL.lots,docId:id,product:o.product,summary:`${lotLabel(o)} · ${fmt(o.qtyIn)} kg`,changes:ch}); }
  else logHistory({action:'Lot 직접 입고',kind:'add',col:COL.lots,docId:o.id,product:o.product,summary:`${lotLabel(o)} · ${fmt(o.qtyIn)} kg · ${dstr(o.receivedDate)}${o.invoice?' · '+o.invoice:''}`});
}
async function delLot(id){
  const us=state.usage.filter(u=>u.lotId===id);
  if(!confirm(`이 Lot을 삭제할까요?${us.length?`\n연결된 사용 기록 ${us.length}건도 함께 삭제됩니다.`:''}`)) return;
  const lot=state.lots.find(x=>x.id===id)||{};
  const det=outDetach(us.map(u=>u.id));
  try{ await dbBatch([{t:'del',col:COL.lots,id},...us.map(u=>({t:'del',col:COL.usage,id:u.id})),...det.ops]); }catch(e){ toast('삭제 실패: '+(e.code||e.message),5000); return; }
  runOutLogs(det.logs); closeModal(); toast('삭제되었습니다');
  logHistory({action:'Lot 삭제',kind:'del',col:COL.lots,docId:id,product:lot.product,summary:`${lotLabel(lot)} · 입고 ${fmt(lot.qtyIn)} kg${us.length?` · 사용기록 ${us.length}건 함께 삭제`:''}`});
}

/* ---------- 출고·사용 등록 (여러 Lot 동시) ---------- */
let uRows=[];
function usageModal(k,lotId){
  k=k||state.prod; const p=P(k);
  const avail=state.lots.filter(l=>l.product===k&&lotRem(l)>0).sort((a,b)=>(dstr(a.receivedDate)||'').localeCompare(dstr(b.receivedDate)||''));
  uRows=lotId?[{lotId,ea:''}]:[{lotId:(avail.find(l=>!l.hold)||avail[0]||{}).id||'',ea:''}];
  const d=today();
  openModal(`<h3>📤 출고·사용 등록 — ${esc(p.name)}</h3>
  <div class="form-grid">
    <div class="fld"><label>품목</label><select id="u_prod" onchange="app.closeModal();app.usageModal(this.value)">${products().map(x=>`<option value="${x.key}" ${x.key===k?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
    <div class="fld"><label>일자</label><input type="date" id="u_date" value="${d}" onchange="app.suggestLot()"></div>
    <div class="fld"><label>구분</label><select id="u_type" onchange="app.uTypeChange()">
      <option value="출하">출하 (고객 출고)</option><option value="ISO충전">ISO 충전 (IBC→ISO 재포장)</option><option value="반납">반납 (재고 복귀)</option><option value="조정">재고 조정 (손실·샘플 등)</option></select></div>
    <div class="fld"><label>고객 <span class="help" id="u_custReq">· 출하 시 필수</span></label><input type="text" id="u_cust" list="custList" placeholder="Qcells, PVJC, ESF…" oninput="app.syncPrice('u')">${custList('custList',state.usage.map(u=>u.customer).concat(state.isos.map(i=>i.customer)).filter(Boolean))}</div>
    <div class="fld"><label>JNFAM Lot #</label><input type="text" id="u_jl" value="${nextJnfamLot(k,d)}"></div>
    <div class="fld" id="u_isoBox" style="display:none"><label>ISO 탱크 번호</label><input type="text" id="u_tank" placeholder="예: ISO Tank 4"></div>
    <div class="fld full"><label>비고</label><input type="text" id="u_note"></div>
    <div class="fld full" id="u_syncWrap">${syncBox('u',k)}</div>
  </div>
  <h3 style="margin:18px 0 8px;font-size:14px">사용 Lot (입고일 순 · FIFO 권장)</h3>
  <table class="split-tbl"><thead><tr><th>Lot</th><th class="num">현재고</th><th style="width:110px">EA</th><th style="width:140px">kg</th><th></th></tr></thead><tbody id="u_rows"></tbody></table>
  <div style="margin-top:8px"><button class="btn ghost sm" onclick="app.uAddRow()">＋ Lot 추가</button></div>
  <div class="calc-box" style="margin-top:12px" id="u_sum"></div>
  <div class="modal-actions"><button class="btn ghost" onclick="app.closeModal()">취소</button><button class="btn primary" onclick="app.saveUsage('${k}')">저장</button></div>`,true);
  uRender(); syncPrice('u');
}
function uAvail(k){ return state.lots.filter(l=>l.product===k&&(lotRem(l)>0||uRows.some(r=>r.lotId===l.id))).sort((a,b)=>(dstr(a.receivedDate)||'').localeCompare(dstr(b.receivedDate)||'')); }
function uRender(){
  const k=$('u_prod').value; const av=uAvail(k);
  $('u_rows').innerHTML=uRows.map((r,i)=>{ const l=state.lots.find(x=>x.id===r.lotId); const u=l?(+l.unitKg||P(k).ibcKg):P(k).ibcKg;
    return `<tr><td><select onchange="app.uSet(${i},'lotId',this.value)">${av.map(x=>`<option value="${x.id}" ${x.id===r.lotId?'selected':''}>${esc(x.sourceLot||'(no lot)')} · ${dstr(x.receivedDate)} · ${fmt1(lotEA(x))}EA${x.hold?' · HOLD':''}</option>`).join('')}</select></td>
    <td class="num">${l?fmt(lotRem(l))+' kg':''}</td>
    <td><input type="number" step="any" value="${r.ea}" oninput="app.uSet(${i},'ea',this.value)"></td>
    <td><input type="number" step="any" value="${r.kg!=null?r.kg:(r.ea!==''?Math.round(r.ea*u*100)/100:'')}" oninput="app.uSet(${i},'kg',this.value)" id="u_kg${i}"></td>
    <td>${uRows.length>1?`<button class="btn danger sm" onclick="app.uDel(${i})">✕</button>`:''}</td></tr>`; }).join('');
  uSum();
}
function uSet(i,f,v){
  const r=uRows[i];
  if(f==='lotId'){ r.lotId=v; r.kg=null; uRender(); return; }
  const l=state.lots.find(x=>x.id===r.lotId); const u=l?(+l.unitKg||P(l.product).ibcKg):1;
  if(f==='ea'){ r.ea=v; r.kg=null; const el=$('u_kg'+i); if(el) el.value=v!==''?Math.round(+v*u*100)/100:''; }
  if(f==='kg'){ r.kg=v===''?null:+v; }
  uSum();
}
function uAddRow(){ const k=$('u_prod').value; const used=new Set(uRows.map(r=>r.lotId)); const nx=uAvail(k).find(l=>!used.has(l.id)&&!l.hold&&lotRem(l)>0); uRows.push({lotId:nx?nx.id:'',ea:''}); uRender(); }
function uDel(i){ uRows.splice(i,1); uRender(); }
function uKg(r){ const l=state.lots.find(x=>x.id===r.lotId); if(r.kg!=null&&r.kg!=='') return +r.kg; if(r.ea==='') return 0; return +r.ea*(l?(+l.unitKg||P(l.product).ibcKg):0); }
function uSum(){
  const typ=$('u_type').value; let tot=0, ea=0, over=[];
  uRows.forEach(r=>{ const kg=uKg(r); tot+=kg; ea+=+r.ea||0; const l=state.lots.find(x=>x.id===r.lotId); if(l&&typ!=='반납'&&kg>lotRem(l)+0.01) over.push(l.sourceLot); });
  const p=P($('u_prod').value);
  $('u_sum').innerHTML=`<span>합계 <b>${fmt1(ea)} EA</b></span><span><b>${fmt(tot)} kg</b></span>${typ==='ISO충전'?`<span>ISO 1탱크 기준 ${fmt(p.isoKg)} kg → <b class="${Math.abs(tot-p.isoKg)<1?'good':'bad'}">${tot-p.isoKg>=0?'+':''}${fmt(tot-p.isoKg)} kg</b></span>`:''}${over.length?`<span class="bad">⚠ 현재고 초과: ${esc(over.join(', '))}</span>`:''}`;
  syncAmt('u');
}
function uTypeChange(){ const t=$('u_type').value; $('u_isoBox').style.display=t==='ISO충전'?'block':'none'; $('u_syncWrap').style.display=t==='출하'?'block':'none'; $('u_custReq').style.display=t==='출하'?'inline':'none'; uSum(); }
function suggestLot(){ const k=$('u_prod').value; $('u_jl').value=nextJnfamLot(k,$('u_date').value); }
async function saveUsage(k){
  const typ=$('u_type').value, date=$('u_date').value, cust=$('u_cust').value.trim(), jl=$('u_jl').value.trim(), note=$('u_note').value.trim();
  if(!date){ toast('일자를 입력하세요'); return; }
  const rows=uRows.map(r=>({...r,kgv:uKg(r)})).filter(r=>r.lotId&&r.kgv>0);
  if(!rows.length){ toast('수량을 입력하세요'); return; }
  for(const r of rows){ const l=state.lots.find(x=>x.id===r.lotId); if(typ!=='반납'&&r.kgv>lotRem(l)+0.01&&!confirm(`Lot ${l.sourceLot}의 현재고(${fmt(lotRem(l))}kg)를 초과합니다. 그래도 저장할까요?`)) return; }
  if(typ==='출하'&&!cust){ toast('출하는 고객을 입력하세요 (수불부 판매처로 등록됩니다)'); $('u_cust').focus(); return; }
  const doSync=typ==='출하'&&!!fb&&!!ledgerKey(k)&&!!$('u_sync')&&$('u_sync').checked;
  const price=doSync?(+$('u_price').value||0):0;
  if(doSync&&!price&&!confirm('단가가 비어 있습니다. 수불부에 금액 $0으로 등록할까요?\n(나중에 수불부에서 단가를 수정할 수 있습니다)')) return;
  const ops=[]; const isoId=typ==='ISO충전'?uid('is'):null; const uids=[];
  const outId=doSync?uid('out'):null;
  rows.forEach(r=>{ const id=uid('us'); uids.push(id);
    ops.push({t:'set',col:COL.usage,data:{id,lotId:r.lotId,product:k,date,type:typ,qtyKg:typ==='반납'?-Math.abs(r.kgv):r.kgv,ea:r.ea!==''?+r.ea:null,customer:cust,jnfamLot:jl,note,isoId,...(outId?{outboundId:outId}:{})}}); });

    ops.push({t:'set',col:COL.isos,data:{id:isoId,product:k,tankNo:$('u_tank').value.trim(),qtyKg:tot,fillDate:date,status:'대기',customer:cust,jnfamLot:jl,note,sourceUsageIds:uids,shipDate:''}}); }
  let orec=null;
  if(doSync){
    orec={...outRec({k,date,buyer:cust,pack:$('u_pack').value,qty:rows.reduce((s,r)=>s+r.kgv,0),price,note:[jl,note].filter(Boolean).join(' / '),usageIds:uids}),id:outId};
    const invOnly=ops.map(o=>{ const d={...o.data}; delete d.outboundId; return {...o,data:d}; });
    ops.push({t:'set',col:COL.out,data:orec}, ...buyerOps(cust));
    const ok=await batchWithOut(ops,invOnly); if(ok===null) return; if(!ok) orec=null;
  } else await dbBatch(ops);
  if(orec) ledgerOutLog('출고 등록 (재고현황 연동)','add',orec);
  { const tot=rows.reduce((s,r)=>s+r.kgv,0); const lotsTxt=rows.map(r=>{ const l=state.lots.find(x=>x.id===r.lotId)||{}; return `${l.sourceLot||'?'}(${fmt(r.kgv)})`; }).join(', ');
    logHistory({action:typ==='ISO충전'?'ISO 충전':typ==='출하'?'출하 등록':typ+' 등록',kind:'out',col:COL.usage,docId:uids[0],product:k,
      summary:`${pname(k)} · ${fmt(tot)} kg${cust?' · '+cust:''}${jl?' · '+jl:''} · Lot ${lotsTxt}`}); }

}
async function delUsage(id,lotId){

async function saveIso(id){

        if(ch.length){ await dbBatch([{t:'patch',col:COL.out,id:ob.id,data:np},...buyerOps(np.buyer)]); ledgerOutLog('출고 수정 (재고현황 연동)','upd',{...ob,...np},ch); } }

async function doIsoShip(id){
  const i={...(state.isos.find(x=>x.id===id)||{})};
  const patch={status:'출하완료',shipDate:$('s_date').value||today(),customer:$('s_cust').value.trim(),jnfamLot:$('s_jl').value.trim()};
  if(!patch.customer){ toast('고객을 입력하세요'); $('s_cust').focus(); return; }
  const canLed=!!fb&&!!ledgerKey(i.product)&&!state.outErr&&!outExists(i.outboundId)&&!!$('s_cands');
  const link=canLed?((document.querySelector('input[name=sLink]:checked')||{}).value||''):'';
  let orec=null, linked=null;
  if(canLed&&link){
    linked=state.outbound.find(o=>o.id===link);
    const invOnly=[{t:'patch',col:COL.isos,id,data:{...patch}}];
    const ok=await batchWithOut([{t:'patch',col:COL.isos,id,data:{...patch,outboundId:link}},{t:'patch',col:COL.out,id:link,data:{src:'inventory',invIsoId:id}}],invOnly);
    if(ok===null) return; if(!ok) linked=null;
  } else if(canLed){
    const buyer=$('s_buyer').value; if(!buyer){ toast('수불부 판매처를 선택하세요'); $('s_buyer').focus(); return; }
    const price=+$('s_price').value||0;
    if(!price&&!confirm('단가가 비어 있습니다. 수불부에 금액 $0으로 등록할까요?')) return;
    orec=outRec({k:i.product,date:patch.shipDate,buyer,pack:$('s_pack').value,qty:i.qtyKg,price,note:[patch.jnfamLot,i.tankNo?'ISO '+i.tankNo:''].filter(Boolean).join(' / '),isoId:id});
    const invOnly=[{t:'patch',col:COL.isos,id,data:{...patch}}];
    const ok=await batchWithOut([{t:'patch',col:COL.isos,id,data:{...patch,outboundId:orec.id}},{t:'set',col:COL.out,data:orec},...buyerOps(buyer)],invOnly);
    if(ok===null) return; if(!ok) orec=null;
  } else await dbPatch(COL.isos,id,patch);
  if(orec) ledgerOutLog('출고 등록 (재고현황 연동)','add',orec);
  if(linked) ledgerOutLog('출고 연결 (재고현황 연동)','upd',linked);
  closeModal(); toast(orec?'ISO 출하 처리 — 수불부 출고도 등록되었습니다':linked?'ISO 출하 처리 — 기존 수불부 출고와 연결되었습니다':'ISO 출하 처리되었습니다');
  logHistory({action:'ISO 출하',kind:'out',col:COL.isos,docId:id,product:i.product,summary:`${pname(i.product)} · ${i.tankNo||'ISO'} · ${fmt(i.qtyKg)} kg → ${patch.customer||'-'} · ${patch.shipDate}`,changes:diffObj(i,patch)});
}

  const tot=rvRows.reduce((s,x)=>s+x.ea*x.unit,0); const got=r.id?recvKg(r):0; const cum=got+tot, q=+r.qty||0; const done=cum>=q*(1-RECV_TOL); const diff=cum-q;
  el.innerHTML=`<span>이번 입고 <b>${fmt(tot)} kg</b> (${fmt1(rvRows.reduce((s,x)=>s+x.ea,0))} EA)</span>${got?`<span>누적 <b>${fmt(cum)} kg</b></span>`:''}<span>수불부 ${fmt(q)} kg 대비 <b class="${done?'good':'bad'}">${diff>=0?'+':''}${fmt(diff)} kg</b></span>`
    +(r.invType==='미착품'?(done?'<span class="good"><b>✓ 전량 입고</b> — 저장 후 수불부 상품 전환 여부를 묻습니다</span>':`<span class="help">부분 입고 — 수불부는 미착품 유지, 남은 ${fmt(Math.max(0,q-cum))} kg 운송중</span>`):''); }
function ledgerCode(r,type){ const pre={'상품':'04','미착품':'05','선적예정(미인식)':'00'}[type]||'04';
  const ab={HF:'HF',HNO3:'HN',HCl:'HCl',H2SO4:'H2S'}[r.item]||r.item; const sup=r.supplier==='JNF CO.,LTD.'?'JNF':(r.supplier||'').replace(/[^A-Za-z0-9]/g,'').slice(0,8);
  return pre+ab+(r.pack||'')+sup+(Number(r.purity)*100).toFixed(2)+'%'; }
async function doReceive(ledgerId){
  const r=state.ledger.find(x=>x.id===ledgerId); const k=ledgerProd(r);
  const d=$('rv_date').value; if(!d){ toast('창고 입고일을 입력하세요'); return; }
  const rows=rvRows.filter(x=>x.ea*x.unit>0);
  if(!rows.length){ toast('Lot 수량을 입력하세요'); return; }
  if(rows.some(x=>!x.lot.trim())){ toast('모든 Lot 번호를 입력하세요'); return; }
  const dup=rows.find(x=>state.lots.some(l=>l.product===k&&l.sourceLot===x.lot.trim()));
  if(dup&&!confirm(`Lot ${dup.lot}은 이미 등록되어 있습니다. 그래도 등록할까요?`)) return;
  const shelf=$('rv_shelf').value||addDays(d,364);
  const ops=rows.map(x=>({t:'set',col:COL.lots,data:{id:uid('lo'),product:k,receivedDate:d,sourceLot:x.lot.trim(),container:$('rv_cont').value,unitKg:x.unit,qtyIn:Math.round(x.ea*x.unit*100)/100,
    location:$('rv_loc').value.trim()||'창고',mfgDate:$('rv_mfg').value,shelfLife:shelf,coa:$('rv_coa').checked,hold:false,note:$('rv_note').value.trim(),jnfamLots:'',invoice:(r.invoice||'').trim(),ledgerInboundId:r.id}}));
  const tot=rows.reduce((s,x)=>s+x.ea*x.unit,0), before=recvKg(r), cum=before+tot, q=+r.qty||0, done=cum>=q*(1-RECV_TOL);
  if(cum>q*(1+RECV_TOL)&&!confirm(`누적 입고 ${fmt(cum)} kg이 수불부 수량 ${fmt(q)} kg보다 많습니다. 그래도 저장할까요?`)) return;
  try{
    await dbBatch(ops);
    closeModal();
    logHistory({action:before>0||(!done&&r.invType==='미착품')?'부분 입고 등록':'입고 등록',kind:'add',col:COL.lots,docId:ops[0].data.id,product:k,
      summary:`${pname(k)} · ${fmt(tot)} kg · ${rows.length} Lot (${rows.map(x=>x.lot.trim()).join(', ')}) · ${(r.invoice||'').trim()||'-'} · 입고일 ${d} · 누적 ${fmt(cum)}/${fmt(q)} kg`});
    if(r.invType==='미착품'&&done){
      if(confirm(`전량 입고되었습니다 (누적 ${fmt(cum)} / 수불부 ${fmt(q)} kg).\n수불부 미착품(05) → 상품(04)으로 전환할까요?\n창고입고일: ${d}`)){ await convertLedger(r.id,d,true); return; }
      toast('입고 등록 완료 — 수불부 전환은 입고 예정 목록의 “수불부 상품 전환”으로 할 수 있습니다',5000);
    } else toast(r.invType==='미착품'?`부분 입고 등록 (${fmt(cum)} / ${fmt(q)} kg) — 남은 ${fmt(Math.max(0,q-cum))} kg은 운송중으로 유지`:`입고 등록 완료 (${rows.length} Lot)`,4500);
  }catch(e){ console.error(e); toast('저장 실패: '+(e.code||e.message),5000); }
}
/* 수불부 미착품 → 상품 전환 (전량 입고 후) */
async function convertLedger(ledgerId,date,skipConfirm){
  const r=state.ledger.find(x=>x.id===ledgerId); if(!r||r.invType==='상품') return;
  const d=date||recvLots(r).map(l=>dstr(l.receivedDate)).sort().pop()||today();
  if(!skipConfirm&&!confirm(`수불부 ${(r.invoice||'').trim()} (${fmt(r.qty)} kg)을 미착품(05) → 상품(04)으로 전환할까요?\n누적 입고 ${fmt(recvKg(r))} kg · 창고입고일 ${d}`)) return;
  try{
    await dbPatch(COL.ledger,r.id,{invType:'상품',plantEta:d,convert:{prevCode:ledgerCode(r,r.invType),date:today(),note:'재고현황 시스템에서 입고 등록'+(recvLots(r).length>1?' (분할 입고)':'')},note:(r.note?r.note+' / ':'')+'미착품 전환 '+today()});
    logHistory({action:'입고완료(05→04)',kind:'cv',col:'inbound',docId:r.id,
      summary:`${ledgerCode(r,'상품')} · ${fmt(r.qty)} kg${r.invoice?' · '+String(r.invoice).trim():''} (재고현황 시스템 · 누적 입고 ${fmt(recvKg(r))} kg)`,
      changes:[{f:'invType',label:'재고구분',from:r.invType,to:'상품'},{f:'plantEta',label:'창고입고일',from:dstr(r.plantEta)||'(빈값)',to:d}]}, COL.ledgerHist);
    toast('수불부 상품 전환 완료');
  }catch(e){ toast('수불부 전환 실패: '+(e.code||e.message),5000); }
}

  const ids=new Set(state.lots.filter(l=>l.createdBy==='excel-import').map(l=>l.id));
  const ops=[...state.lots.filter(l=>ids.has(l.id)).map(l=>({t:'del',col:COL.lots,id:l.id})),
    ...state.usage.filter(u=>u.createdBy==='excel-import').map(u=>({t:'del',col:COL.usage,id:u.id})),
    ...state.isos.filter(i=>i.createdBy==='excel-import').map(i=>({t:'del',col:COL.isos,id:i.id}))];
  await dbBatch(ops); toast('삭제되었습니다');
  logHistory({action:'이관 데이터 삭제',kind:'del',summary:`엑셀 이관 데이터 ${ops.length}건 삭제`});
}
function exportExcel(){
  if(typeof XLSX==='undefined'){ toast('엑셀 라이브러리를 불러오지 못했습니다'); return; }
  const wb=XLSX.utils.book_new();
  const sum=products().map(p=>{ const s=stockOf(p.key); return {'품목':p.name,'창고 재고(IBC+ISO, kg)':s.onHand,'IBC(kg)':s.ibc,'IBC(EA)':+s.ea.toFixed(1),'Hold(kg)':s.hold,'ISO 대기(kg)':s.iso,'ISO 탱크':s.isoCnt,'운송중(kg)':s.transit,'합계(kg)':s.total,'최근30일 출하(kg)':s.out30}; });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sum),'요약 '+today());
  products().forEach(p=>{
    const rows=state.lots.filter(l=>l.product===p.key).sort((a,b)=>(dstr(a.receivedDate)||'').localeCompare(dstr(b.receivedDate)||'')).map(l=>({'입고일':dstr(l.receivedDate),'제품명':p.name,'Lot # (From source)':l.sourceLot,'Lot # JNFAM Product':l.jnfamLots,'입고수량(kg)':l.qtyIn,'보관용기':l.container,'현재고(kg)':lotRem(l),'사용수량(kg)':lotUsedC(l),'EA':+lotEA(l).toFixed(2),'보관위치':l.location,'MFG Date':dstr(l.mfgDate),'shelf life':l.shelfLife,'CoA':l.coa?'Y':'N','Hold':l.hold?'Y':'','Invoice':l.invoice,'비고':l.note}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{}]),p.name.replace(/[\\/?*\[\]:]/g,'').slice(0,31));
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.usage.map(u=>{ const l=state.lots.find(x=>x.id===u.lotId)||{}; return {'일자':dstr(u.date),'품목':pname(u.product),'구분':u.type,'Source Lot':l.sourceLot,'EA':u.ea,'수량(kg)':u.qtyKg,'고객':u.customer,'JNFAM Lot':u.jnfamLot,'비고':u.note,'등록자':u.createdBy}; })),'출고·사용');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.isos.map(i=>({'상태':i.status,'품목':pname(i.product),'탱크':i.tankNo,'충전일':dstr(i.fillDate),'수량(kg)':i.qtyKg,'고객':i.customer,'JNFAM Lot':i.jnfamLot,'출하일':dstr(i.shipDate),'비고':i.note}))),'ISO');
  XLSX.writeFile(wb,`JNFAM_Inventory_${today()}.xlsx`);
}
